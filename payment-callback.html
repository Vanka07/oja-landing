<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Status — Oja POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', -apple-system, sans-serif;
      background: #0c0a09;
      color: #fafaf9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1c1917;
      border: 1px solid #292524;
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 40px;
    }
    .icon.success { background: rgba(16, 185, 129, 0.15); }
    .icon.failed { background: rgba(239, 68, 68, 0.15); }
    .icon.loading { background: rgba(224, 94, 27, 0.15); }
    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .success h1 { color: #10b981; }
    .failed h1 { color: #ef4444; }
    p {
      color: #a8a29e;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .ref {
      color: #57534e;
      font-size: 12px;
      margin-top: 16px;
      word-break: break-all;
    }
    .btn {
      display: inline-block;
      margin-top: 24px;
      padding: 14px 32px;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #e05e1b; color: white; }
    .btn-secondary { background: #292524; color: #a8a29e; margin-left: 8px; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #292524;
      border-top-color: #e05e1b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo {
      font-size: 14px;
      color: #57534e;
      margin-top: 32px;
    }
    .logo span { color: #e05e1b; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="icon loading">
      <div class="spinner"></div>
    </div>
    <h1>Processing...</h1>
    <p>Checking your payment status.</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference') || params.get('trxref') || '';
    const card = document.getElementById('card');

    function showSuccess() {
      card.innerHTML = `
        <div class="icon success">✅</div>
        <div class="success">
          <h1>Payment Successful!</h1>
        </div>
        <p>Your Oja POS Business plan has been activated. You can now close this window and return to the app.</p>
        ${reference ? `<p class="ref">Reference: ${reference}</p>` : ''}
        <div class="logo">Powered by <span>Oja POS</span></div>
      `;
    }

    function showFailed(msg) {
      card.innerHTML = `
        <div class="icon failed">❌</div>
        <div class="failed">
          <h1>Payment Failed</h1>
        </div>
        <p>${msg || 'Something went wrong with your payment. Please try again from the app.'}</p>
        ${reference ? `<p class="ref">Reference: ${reference}</p>` : ''}
        <a href="/" class="btn btn-secondary">Back to Oja POS</a>
        <div class="logo">Powered by <span>Oja POS</span></div>
      `;
    }

    // If we have a reference, the payment likely went through (Paystack redirects on success)
    if (reference) {
      showSuccess();
    } else {
      // No reference = something went wrong or user cancelled
      showFailed('No payment reference found. If you completed the payment, please return to the app and verify manually.');
    }
  </script>
</body>
</html>
